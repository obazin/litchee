name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test, lint, and docs (stable)
    runs-on: ubuntu-latest
    # The repo no longer commits a rust-toolchain.toml — the pin lives in the
    # rust-projects flake and the dev shell materializes it locally, so a
    # checkout here carries no directory override. RUSTUP_TOOLCHAIN stays as an
    # explicit statement that this job is the current-stable one, and as a guard
    # in case a toml ever reappears in the tree.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # The file half of CLAUDE.md rule 2, over every .rs file git knows about
      # (physical lines, comments included). The function half (20 body lines,
      # src/ only) rides on clippy::too_many_lines below, whose threshold
      # clippy.toml pins to 20; tests/ and examples/ sit outside that boundary
      # and each carry a file-level allow, guarded by tests/size_boundary_guard.rs.
      - name: Enforce the 900-line file cap
        run: ./scripts/check-file-size.sh

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # Version-agnostic name on purpose: it is a required status check, so it
    # must not change every time the toolchain moves.
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The MSRV tracks the latest stable pinned by the rust-projects flake and
      # is declared once, as Cargo.toml's rust-version. Read it from there so a
      # toolchain bump never needs a matching edit here.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version" || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Check library
        # Only the library affects downstream MSRV; dev-deps (tests/examples)
        # may require a newer toolchain.
        run: cargo check --all-features

  audit:
    name: Security advisories (cargo audit)
    runs-on: ubuntu-latest
    # rustsec/audit-check@v2 still declares the Node.js 20 runtime, which is
    # being removed from runners on 2026-09-16. The node24 fix exists only on
    # the action's unreleased default branch, so opt the job into the Node.js 24
    # runtime via GitHub's documented override until a tagged release ships it.
    #
    # RUSTUP_TOOLCHAIN=stable: the action runs `cargo install cargo-audit`, whose
    # dependency tree tracks recent rustc releases. This job installs no
    # toolchain of its own, so keep it explicitly on the runner's stable rather
    # than whatever default or directory override might apply (same reasoning
    # as `test` above).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - name: Audit dependencies for RustSec advisories
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
