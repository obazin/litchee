# Clippy thresholds tuned to reinforce the project's "small units" rule
# (see CLAUDE.md). Lint *levels* (deny-warnings, pedantic opt-ins) are applied
# from the `[lints]` table in Cargo.toml and CI flags, not here.

# The 20-LOC method/function cap from CLAUDE.md rule 2, enforced by
# `clippy::too_many_lines` (pedantic, denied in CI). Clippy counts body lines,
# ignoring comments and blank lines.
#
# Two caveats worth knowing before trusting this as airtight:
#   - The 20 integration-test/example files carrying long linear arrange/assert
#     blocks that predate the check opt out with a file-level
#     `#![allow(clippy::too_many_lines)]`. Grep that name to find the debt.
#   - The lint measures a function's *source* span, so a body generated by a
#     `macro_rules!` is measured at the macro definition, not the expansion
#     (see the `scopes!` table in src/api/auth/oauth/scope.rs). A macro wrapper
#     therefore sidesteps the cap.
too-many-lines-threshold = 20

# Keep functions simple; a high score usually means the 20-LOC limit is at risk.
cognitive-complexity-threshold = 15

# Encourage builders / param structs instead of wide signatures.
# (Clippy's default; a few builder constructors legitimately take 6 inputs.)
too-many-arguments-threshold = 7

# Flag gnarly types early so we introduce aliases / newtypes.
type-complexity-threshold = 250

# Apply pedantic lints to the public API too (this is a client library).
avoid-breaking-exported-api = false
